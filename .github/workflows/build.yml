name: Build HNC arm64

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive       # v5.1: 拉 third_party/{libbpf,libelf,zlib}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install tools (clang for BPF object)
        run: sudo apt-get install -y zip unzip file clang llvm

      - name: Debug NDK + submodules
        run: |
          echo "NDK path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}" | head -5
          echo "--- submodules ---"
          git submodule status
          ls third_party/libbpf/src/*.c | head -3
          ls third_party/libelf/libelf/*.c | head -3
          ls third_party/zlib/*.c | head -3

      # v5.0.0-beta.4 hotfix6: build third_party libs first
      - name: Build third_party libs (zlib + libelf + libbpf)
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd third_party_build
          bash build_libs.sh arm64
          ls -la _libs_out/lib/

      - name: Build hotspotd + hnc_ipc
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          cd daemon/hotspotd
          bash build.sh arm64

      - name: Build hnc_httpd
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          cd daemon/hnc_httpd
          bash build.sh arm64
        continue-on-error: true

      - name: Build hnc_tc_ingress (raw-netlink tool)
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          cd daemon/tc_netlink
          bash build.sh arm64

      - name: Verify binaries
        run: |
          echo "=== bin/ 内容 ==="
          ls -la bin/ | head -20
          if [ ! -f bin/hotspotd ]; then
            find daemon/ -name "hotspotd" -type f -exec cp {} bin/ \;
          fi
          if [ ! -f bin/hnc_ipc ]; then
            find daemon/ -name "hnc_ipc" -type f -exec cp {} bin/ \;
          fi
          if [ ! -f bin/hnc_tc_ingress ]; then
            find daemon/tc_netlink -name "hnc_tc_ingress" -type f -exec cp {} bin/ \;
          fi
          echo "=== 关键 ARM aarch64 检查 ==="
          ls -la bin/hotspotd bin/hnc_ipc bin/hnc_tc_ingress
          file bin/hotspotd         | grep -q "ARM aarch64" || exit 1
          file bin/hnc_ipc          | grep -q "ARM aarch64" || exit 1
          file bin/hnc_tc_ingress   | grep -q "ARM aarch64" || exit 1

      - name: Verify BPF object
        run: |
          echo "=== bpf/ ==="
          ls -la bpf/ 2>/dev/null
          if [ -f bpf/hnc_limit_map_guard.bpf.o ]; then
            file bpf/hnc_limit_map_guard.bpf.o
          else
            echo "WARN: BPF object missing - LSM will not load"
          fi

      - name: Fix permissions
        run: |
          chmod 755 bin/*.sh bin/hotspotd bin/hnc_ipc bin/hnc_tc_ingress bin/mdns_resolve 2>/dev/null || true
          chmod 755 daemon/hnc_httpd/hnc_httpd 2>/dev/null || true
          chmod 755 post-fs-data.sh service.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          VERSION_SAFE=${VERSION//./_}
          VERSION_SAFE=${VERSION_SAFE//+/_}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_safe=$VERSION_SAFE" >> $GITHUB_OUTPUT

      - name: Pack zip
        run: |
          OUT="HNC-${{ steps.version.outputs.version_safe }}-arm64.zip"
          rm -rf daemon/hotspotd/prebuilt daemon/hotspotd/tools/prebuilt
          rm -rf daemon/tc_netlink/out
          rm -rf third_party_build/_libs_out third_party_build/_obj
          rm -rf third_party
          zip -rqX "$OUT" . -x ".*" -x "*/.*" -x "*.zip" -x ".github/*"
          echo "OUT_ZIP=$OUT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNC-${{ steps.version.outputs.version_safe }}-arm64
          path: ${{ env.OUT_ZIP }}
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT_ZIP }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
