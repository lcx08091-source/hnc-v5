name: Build HNC arm64

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install tools
        run: sudo apt-get install -y zip unzip

      - name: Build hotspotd + hnc_ipc
        run: |
          cd daemon/hotspotd
          bash build.sh arm64
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build hnc_httpd
        run: |
          cd daemon/hnc_httpd
          bash build.sh arm64
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        continue-on-error: true

      - name: Verify binaries
        run: |
          ls -la bin/hotspotd bin/hnc_ipc
          file bin/hotspotd | grep -q "ARM aarch64" || exit 1
          file bin/hnc_ipc | grep -q "ARM aarch64" || exit 1

      - name: Fix permissions
        run: |
          chmod 755 bin/*.sh bin/hotspotd bin/hnc_ipc bin/mdns_resolve 2>/dev/null || true
          chmod 755 daemon/hnc_httpd/hnc_httpd 2>/dev/null || true
          chmod 755 post-fs-data.sh service.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          VERSION_SAFE=${VERSION//./_}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_safe=$VERSION_SAFE" >> $GITHUB_OUTPUT

      - name: Pack zip
        run: |
          OUT="HNC-${{ steps.version.outputs.version_safe }}-arm64.zip"
          rm -rf daemon/hotspotd/prebuilt daemon/hotspotd/tools/prebuilt
          zip -rqX "$OUT" . -x ".*" -x "*/.*" -x "*.zip" -x ".github/*"
          echo "OUT_ZIP=$OUT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNC-${{ steps.version.outputs.version_safe }}-arm64
          path: ${{ env.OUT_ZIP }}
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT_ZIP }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
