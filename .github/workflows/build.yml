name: Build HNC arm64

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install tools
        run: sudo apt-get install -y zip unzip file

      - name: Debug NDK path
        run: |
          echo "NDK path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}" | head -5

      - name: Build hotspotd + hnc_ipc
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          echo "=== ANDROID_NDK=$ANDROID_NDK ==="
          cd daemon/hotspotd
          bash build.sh arm64

      - name: Build hnc_httpd
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          cd daemon/hnc_httpd
          bash build.sh arm64
        continue-on-error: true

      - name: Verify binaries
        run: |
          echo "=== bin/ 内容 ==="
          ls -la bin/ | head -20
          echo "=== 检查关键文件 ==="
          ls -la bin/hotspotd bin/hnc_ipc 2>&1 || true
          # 如果 hotspotd 不在 bin/ 里, 从 daemon/ 位置拷过来
          if [ ! -f bin/hotspotd ]; then
            find daemon/ -name "hotspotd" -type f -exec cp {} bin/ \;
          fi
          if [ ! -f bin/hnc_ipc ]; then
            find daemon/ -name "hnc_ipc" -type f -exec cp {} bin/ \;
          fi
          ls -la bin/hotspotd bin/hnc_ipc
          file bin/hotspotd | grep -q "ARM aarch64" || exit 1
          file bin/hnc_ipc | grep -q "ARM aarch64" || exit 1

      - name: Fix permissions
        run: |
          chmod 755 bin/*.sh bin/hotspotd bin/hnc_ipc bin/mdns_resolve 2>/dev/null || true
          chmod 755 daemon/hnc_httpd/hnc_httpd 2>/dev/null || true
          chmod 755 post-fs-data.sh service.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          VERSION_SAFE=${VERSION//./_}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_safe=$VERSION_SAFE" >> $GITHUB_OUTPUT

      - name: Pack zip
        run: |
          OUT="HNC-${{ steps.version.outputs.version_safe }}-arm64.zip"
          rm -rf daemon/hotspotd/prebuilt daemon/hotspotd/tools/prebuilt
          zip -rqX "$OUT" . -x ".*" -x "*/.*" -x "*.zip" -x ".github/*"
          ls -lh "$OUT"
          echo "OUT_ZIP=$OUT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNC-${{ steps.version.outputs.version_safe }}-arm64
          path: ${{ env.OUT_ZIP }}
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT_ZIP }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
